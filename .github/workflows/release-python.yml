name: Release Python

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - backport/**
    paths:
      - "generated/python/**"
      - ".github/workflows/release-python.yml"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: PyPI
    permissions:
      id-token: write
      contents: write
      pull-requests: read
    defaults:
      run:
        working-directory: generated/python/datadoc_model
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DAPLA_BOT_APP_ID }}
          private-key: ${{ secrets.DAPLA_BOT_PRIVATE_KEY }}

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Check if there is a parent commit
        id: check-parent-commit
        run: |
          echo "sha=$(git rev-parse --verify --quiet HEAD^)" >> $GITHUB_OUTPUT

      - name: Detect and tag new version
        id: check-version
        if: steps.check-parent-commit.outputs.sha
        uses: salsify/action-detect-and-tag-new-version@b1778166f13188a9d478e2d1198f993011ba9864 # v2.0.3
        with:
          version-command: |
            uv version --short --project generated/python/datadoc_model

      - name: Set version for developmental release
        if: (!steps.check-version.outputs.tag) && (github.event_name != 'workflow_dispatch')
        run: |
          uv version "$(uv version --bump patch >> /dev/null 2>&1 && uv version --short).dev.$(date +%s)"

      - name: Build package
        run: |
          uv build

      - name: Publish package on PyPI
        if: (steps.check-version.outputs.tag) || (github.event_name == 'workflow_dispatch')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: generated/python/datadoc_model/dist

      # This package isn't currently published on TestPyPI
      # - name: Publish package on TestPyPI
      #   if: (!steps.check-version.outputs.tag)
      #   uses: pypa/gh-action-pypi-publish@v1.13.0
      #   with:
      #     packages-dir: generated/python/datadoc_model/dist
      #     repository-url: https://test.pypi.org/legacy/

      - name: Publish the release notes
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: ${{ steps.check-version.outputs.tag != '' }}
          tag: ${{ steps.check-version.outputs.tag }}
          config-name: release-drafter-python.yml
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
